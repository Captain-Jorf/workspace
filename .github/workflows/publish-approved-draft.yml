name: publish-approved-draft
on:
  issue_comment:
    types: [created]

jobs:
  publish:
    if: ${{ startsWith(github.event.issue.title, '📈 trend reel draft') && contains(github.event.comment.body, '/publish') }}
    runs-on: ubuntu-latest
    permissions: {contents: read, issues: write}
    steps:
      - name: resolve draft tag
        id: tag
        env: {TITLE: ${{ github.event.issue.title }}}
        run: echo "tag=${TITLE##*draft }" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with: {ref: "drafts/${{ steps.tag.outputs.tag }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: deps
        run: |
          pip install -q pillow numpy arabic_reshaper python-bidi fonttools brotli imageio-ffmpeg
          ./build/fetch_fonts.sh && python3 build/logo_make.py
      - name: render full reel
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          EP=content/episodes/auto-$TAG
          EP_DIR=$EP python3 build/render.py out=output/auto-$TAG.mp4
      - name: upload video publicly (branch) + publish to Instagram
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          git config user.name "trend-factory"; git config user.email "factory@metacognition.hq"
          git add -f output/auto-$TAG.mp4 && git commit -q -m "reel $TAG" && git push -q origin HEAD
          sleep 5
          RAW="https://github.com/${{ github.repository }}/raw/drafts/$TAG/output/auto-$TAG.mp4"
          curl -sfI "$RAW" | head -1 || { echo "video URL not public — make repo public or host elsewhere"; exit 1; }
          mkdir -p secrets && printf "IG_USER_ID=%s\nPAGE_TOKEN=%s\n" "$IG_USER_ID" "$PAGE_TOKEN" > secrets/insta.env
          python3 build/insta_publish.py publish --video "$RAW" --caption output/auto-${TAG}_caption.txt
          gh issue comment ${{ github.event.issue.number }} --body "✅ published to Instagram from draft $TAG"
