# RETIRED — the /publish approval gate is no longer part of the pipeline.
#
# The factory is autonomous: build/qa_supervisor.py decides, and
# daily-trend-draft.yml queues the reel in Buffer only when it is approved
# and the repo variable AUTO_PUBLISH_ENABLED == "true".
#
# This file is intentionally kept as a no-op so an old copy on another branch
# can never publish: it has no triggers other than manual dispatch, no secrets,
# no permissions, and it only prints a notice.
name: publish-approved-draft (retired)
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "This workflow is retired. Publishing is handled by daily-trend-draft.yml"
          echo "behind the Quality Supervisor and the AUTO_PUBLISH_ENABLED=true repo variable."
