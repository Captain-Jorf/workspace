# TEMPORARY — real-network verification of the Groq connection check on THIS
# session branch only.
#
# WHY THIS FILE EXISTS: the automation token for this session has no repository
# permissions ({"admin":false,"push":false,"pull":false,"triage":false}), so
# `gh workflow run groq-connection-check --ref arena/01a0a73a-workspace` is
# refused with "HTTP 403: Resource not accessible by integration". A push trigger
# needs no `actions: write`, so this is the only way to execute the REAL check
# against api.groq.com from this session.
#
# SAFETY — identical to groq-connection-check.yml:
#   * ONLY the exact session branch can trigger it
#   * ONLY build/groq_check.py runs. It imports no publishing module and makes
#     no mutation of any kind: three tiny read-only Groq API calls
#     (/models, one producer prompt, one reviewer prompt) on a fixed
#     non-sensitive test packet. No content file, episode, render or queue
#     entry is produced.
#   * no publishing secret is referenced anywhere in this file, so this job has
#     no publishing capability at all
#   * GROQ_API_KEY is in exactly ONE step and is never printed (boolean only)
#   * permissions: {} at the top level, contents: read on the job
#   * no mock: MOCK_GROQ is never set and is explicitly unset
#   * timeout 5 minutes
#   * no other workflow has a push trigger, so nothing else runs from this push
#
# This file is DELETED immediately after the verification run, in the very next
# commit. tests/test_groq_http_client.py
# ::test_no_temporary_branch_trigger_left_behind exists precisely to prove it is
# gone (it fails on purpose while this file is present).
name: tmp-groq-real-check-session-branch
on:
  push:
    branches:
      - arena/01a0a73a-workspace

permissions: {}

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: HTTP client signature self-check (offline, no credentials)
        env:
          CONTENT_LANGUAGE: en
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import sys
          sys.path.insert(0, "build")
          import groq_http
          ua = groq_http.user_agent()
          print(f"Client User-Agent: {ua}")
          assert ua == groq_http.PROJECT_USER_AGENT, "explicit project User-Agent missing"
          assert groq_http.is_acceptable_user_agent(ua), "blocked default client signature"
          for bad in ("Python-urllib/3.11", "python-requests/2.31.0", "", None):
              assert not groq_http.is_acceptable_user_agent(bad), f"accepted bad UA: {bad!r}"
          assert groq_http.build_headers(with_auth=False)["Accept"] == "application/json"
          assert groq_http.build_headers(with_auth=False, with_body=True)["Content-Type"] == "application/json"
          print("HTTP client signature self-check: OK")
          PY

      - name: Groq connection check (real, fail-closed, no mock)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CONTENT_LANGUAGE: en
          CONTENT_PRODUCER: groq
          PRODUCER_MODEL: auto
          REVIEWER_MODEL: auto
        run: |
          set -uo pipefail
          unset MOCK_GROQ || true
          # DIAGNOSTIC SAMPLING: the real check is green on most runs but went
          # red once with exit code 6 (EXIT_JSON = structured-output validation)
          # while every HTTP call returned 200. That pre-dated the annotation
          # emitter, so the exact reason was lost. Sample the real check several
          # times in one run so an intermittent red is captured WITH its safe
          # one-line reason. Each attempt is 3 tiny read-only Groq calls on a
          # fixed non-sensitive packet; nothing is created or published.
          SAMPLES=6
          worst=0
          for i in $(seq 1 "$SAMPLES"); do
            echo "===== real check sample $i/$SAMPLES ====="
            python3 build/groq_check.py \
              --producer-model "$PRODUCER_MODEL" \
              --reviewer-model "$REVIEWER_MODEL"
            code=$?
            echo "----- sample $i exit=$code -----"
            if [ "$code" -gt "$worst" ]; then worst=$code; fi
            sleep 3
          done
          echo "worst exit code across $SAMPLES real samples: $worst"
          exit $worst
