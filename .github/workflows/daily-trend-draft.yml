name: daily-trend-draft
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      selftest:
        description: "silent audio instead of edge-tts (dry run)"
        type: boolean
        default: false

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: deps
        run: |
          pip install -q pillow numpy arabic_reshaper python-bidi fonttools brotli imageio-ffmpeg edge-tts deep-translator
          bash build/fetch_fonts.sh
          python3 build/logo_make.py
      - name: trend radar
        run: python3 build/trend_radar.py --out content/trends.json
      - name: draft episode
        run: |
          TAG=$(date -u +%F)
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          python3 build/episode_from_trend.py --top 1 --date "$TAG"
      - name: voice + timing + caption + previews
        run: |
          EP="content/episodes/auto-$TAG"
          if [ "${{ inputs.selftest }}" = "true" ]; then
            python3 - "$EP" <<'PY'
          import json, subprocess, sys
          from imageio_ffmpeg import get_ffmpeg_exe
          ep = sys.argv[1]; ff = get_ffmpeg_exe()
          n = len(json.load(open(ep + "/script.json"))["chunks"])
          for i in range(1, n + 1):
              subprocess.run([ff, "-y", "-loglevel", "error", "-f", "lavfi", "-i",
                              "anullsrc=r=24000:cl=mono", "-t", "5", "-c:a", "libmp3lame",
                              f"{ep}/c{i:02d}.mp3"], check=True)
          print("selftest silent clips ok")
          PY
          else
            python3 build/tts_edge.py "$EP"
          fi
          EP_DIR="$EP" python3 build/timing.py
          python3 build/caption.py "$EP"
          EP_DIR="$EP" python3 build/preview_stills.py
      - name: draft branch + approval issue
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          git config user.name "trend-factory"
          git config user.email "factory@metacognition.hq"
          git add -A
          git commit -q -m "auto draft $TAG" || true
          git push -qf origin "HEAD:refs/heads/drafts/$TAG" || echo "::warning::draft branch push failed"
          {
            echo "## Daily trend reel draft - $TAG"
            echo ""
            echo "Episode: content/episodes/auto-$TAG/script.json"
            echo "Caption: output/auto-$TAG_caption.txt"
            echo "Previews: output/drafts/ on branch drafts/$TAG"
            echo ""
            echo "Review, then comment **/publish** to render + post to Instagram."
            echo "(Needs repo secrets IG_USER_ID + IG_PAGE_TOKEN; video URL must be public.)"
          } > /tmp/body.md
          EXISTING=$(gh issue list --state open --search "in:title trend reel draft $TAG" --json number -q '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/body.md
            echo "updated existing issue #$EXISTING"
          else
            gh label create auto-draft --color 0E8A16 --description "auto trend draft" 2>/dev/null || true
            gh issue create --title "trend reel draft $TAG" --body-file /tmp/body.md --label auto-draft
          fi
