# Autonomous daily reel factory for @metacognition.hq — English-only production
#
#   trend scout → source validation → EN script (Producer/Reviewer/Revision +
#   deterministic pre-render text QA) → topic-aware visual plan + pre-render
#   visual-semantic gate → Edge-TTS → timing → 9:16 scene-plan render →
#   posters → caption → Quality Supervisor (independent, measurable, includes
#   final rendered-visual QA) → publish public files (drafts/<date> branch)
#   → verify URL + MIME → re-supervise
#   → Buffer queue (official API, addToQueue, automatic) ONLY IF approved
#   → exactly ONE GitHub issue per day.
#
# Real publishing needs ALL of:
#   * repo variable AUTO_PUBLISH_ENABLED == "true"  (exact string; missing/True/1 → disabled)
#   * dispatch input dry_run == false                (default true; cron runs use DRY_RUN_CRON var, default false)
#   * Supervisor approved && score >= MIN_QA_SCORE (>= 80 floor) && no blocking errors
# Anything else → status "approved-dry-run": everything is built and reported, createPost is never called.
#
# Security: least-privilege permissions, pinned actions, BUFFER_TOKEN exposed to exactly two
# steps (Buffer queue, read-only metrics sync), never printed. No Meta/Instagram credentials.
name: daily-trend-draft
on:
  schedule:
    - cron: "23 3 * * *"         # 06:53 Asia/Tehran. GitHub delays schedules by hours (observed 5-6 h for "0 6");
                                 # an off-the-hour minute + a 12.5 h margin to the 16:00 UTC (19:30 Tehran) slot.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry run: build + supervise + issue, but never call Buffer createPost"
        type: boolean
        default: true
      calendar_only:
        description: "skip live trend sources, use the evergreen calendar"
        type: boolean
        default: false
      date_tag:
        description: "content date (YYYY-MM-DD); empty = today (UTC)"
        type: string
        default: ""

permissions: {}

concurrency:
  group: daily-reel-${{ inputs.date_tag || 'today' }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  TARGET_BUFFER_CHANNEL: ${{ vars.TARGET_BUFFER_CHANNEL || 'metacognition.hq' }}
  MIN_QA_SCORE: ${{ vars.MIN_QA_SCORE || '85' }}

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write            # push drafts/<date> (public video + previews) and the memory/manifest commit
      issues: write              # the single daily report issue
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: resolve date + mode
        id: mode
        env:
          IN_DRY: ${{ inputs.dry_run }}
          IN_CAL: ${{ inputs.calendar_only }}
          IN_TAG: ${{ inputs.date_tag }}
          EVENT: ${{ github.event_name }}
          DRY_RUN_CRON: ${{ vars.DRY_RUN_CRON }}
        run: |
          set -euo pipefail
          TAG="${IN_TAG:-$(date -u +%F)}"
          echo "$TAG" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "::error::bad date_tag"; exit 1; }
          if [ "$EVENT" = "workflow_dispatch" ]; then
            DRY="${IN_DRY:-true}"
          else
            DRY="${DRY_RUN_CRON:-false}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "DRY=$DRY" >> "$GITHUB_ENV"
          echo "CAL=${IN_CAL:-false}" >> "$GITHUB_ENV"
          echo "date=$TAG dry_run=$DRY calendar_only=${IN_CAL:-false}"

      - name: forbid mock LLM in production (fail closed)
        run: |
          set -euo pipefail
          # MOCK_GROQ=1 is forbidden in cron AND manual dispatch of the
          # daily workflow. Mock fixtures must never become production content.
          # If Groq fails, the pipeline falls back to the curated
          # static English playbooks with generation_mode=static-fallback.
          if [ "${MOCK_GROQ:-}" = "1" ]; then
            echo "::error::mock LLM is forbidden in daily production (MOCK_GROQ must not be enabled)"
            exit 1
          fi
          echo "mock guard: OK (MOCK_GROQ not enabled)"

      - name: dependencies, fonts, stand-in logo, self-test
        run: |
          set -euo pipefail
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          pip install -q -r requirements.txt
          bash build/fetch_fonts.sh
          python3 build/logo_make.py
          ffprobe -version | head -1
          # fail closed: a broken toolchain must never produce a post
          python3 -m unittest discover -s tests -q 2>&1 | tail -3

      - name: produce + supervise (controlled retries inside)
        id: produce
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CONTENT_PRODUCER: groq
          CONTENT_FALLBACK: static-english
          PRODUCER_MODEL: auto
          REVIEWER_MODEL: auto
          # $0 topic photos via the official Openverse API — ENABLED in the
          # production path. No key, no billing, no scraping/automation.
          # License policy: ONLY attribution-free public-domain imagery
          # (CC0 / PDM). CC-BY is deliberately disabled because an internal
          # manifest credit is NOT public attribution on Instagram; the
          # pre-render gate and the renderer both reject any CC-BY asset.
          # A normal reel plans a balanced mix: 2-3 distinct topic-relevant
          # photos + procedural diagrams + brand only at hook/ending.
          # Fail-soft: ANY problem (offline/rate-limited/malformed) falls back
          # to a distinct deterministic procedural visual per scene; the run
          # never pays and never fails because a photo was unavailable.
          ASSET_FETCH: "1"
        run: |
          set +e
          unset MOCK_GROQ || true
          ARGS=""
          [ "$CAL" = "true" ] && ARGS="--calendar-only"
          python3 build/pipeline.py produce --tag "$TAG" $ARGS
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "produce exit=$code (0 = approved candidate, 10 = no post today)"

      - name: publish public files (drafts/<date> orphan branch, working tree untouched)
        id: push
        if: steps.produce.outputs.code == '0'
        run: |
          set -euo pipefail
          git config user.name "reel-factory"
          git config user.email "factory@metacognition.hq"
          # build a single-commit orphan branch from a temporary index: only today's public files,
          # no history, no secrets, and the checked-out working tree is never modified.
          export GIT_INDEX_FILE="$(mktemp)"
          rm -f "$GIT_INDEX_FILE"
          git add -f "output/auto-${TAG}.mp4" "output/auto-${TAG}_poster.jpg" "output/auto-${TAG}_poster_4x5.jpg" \
                     "output/auto-${TAG}_caption.txt" "output/auto-${TAG}_qa.json" "output/auto-${TAG}_qa.md" \
                     "output/drafts/auto-${TAG}/preview_start.jpg" "output/drafts/auto-${TAG}/preview_middle.jpg" \
                     "output/drafts/auto-${TAG}/preview_end.jpg" "output/drafts/auto-${TAG}/qa_contact_sheet.jpg" \
                     "content/episodes/auto-${TAG}/script.json" "content/episodes/auto-${TAG}/timing.json" \
                     "content/episodes/auto-${TAG}/layout.json" "content/episodes/auto-${TAG}/topic.json"
          TREE=$(git write-tree)
          COMMIT=$(git commit-tree "$TREE" -m "public files for reel $TAG (run $GITHUB_RUN_ID)")
          unset GIT_INDEX_FILE
          git push -qf origin "$COMMIT:refs/heads/drafts/$TAG"
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/drafts/$TAG/output/auto-${TAG}.mp4"
          echo "RAW_URL=$RAW" >> "$GITHUB_ENV"
          ok=no
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -I "$RAW" || true)
            if [ "$code" = "200" ]; then ok=yes; echo "public URL live after $i attempt(s)"; break; fi
            echo "attempt $i: HTTP $code — waiting for GitHub CDN"; sleep 10
          done
          [ "$ok" = "yes" ] || { echo "::error::public video URL not reachable"; exit 1; }

      - name: final supervision against the public URL
        id: verify
        if: steps.produce.outputs.code == '0' && steps.push.outcome == 'success'
        run: |
          set +e
          python3 build/pipeline.py verify --tag "$TAG" --public-url "$RAW_URL"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Buffer queue (official API; only when approved AND enabled AND not dry run)
        id: buffer
        # Hard gate: Buffer must only run after produce AND push AND verify ALL
        # succeeded (a skipped upstream step has outcome 'skipped', never 'success',
        # and its outputs are empty). On a QA rejection this step cannot run at
        # all, so its status can never masquerade as the run's outcome.
        if: steps.produce.outputs.code == '0' && steps.push.outcome == 'success' && steps.verify.outcome == 'success' && steps.verify.outputs.code == '0'
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          AUTO_PUBLISH_ENABLED: ${{ vars.AUTO_PUBLISH_ENABLED }}
        run: |
          set +e
          # Precondition guard: a missing public URL is a pipeline precondition
          # failure, NOT a Buffer failure. Even if this step ever ran without a
          # public URL, it must report automation-error and never touch Buffer.
          if [ -z "${RAW_URL:-}" ]; then
            echo "::warning::RAW_URL is empty — no public video URL exists; Buffer must not be touched (precondition failure)"
            echo "status=automation-error" >> "$GITHUB_OUTPUT"
            echo "buffer step: precondition missing (no public URL) → automation-error, no Buffer call"
            exit 0
          fi
          ARGS="--yes"
          [ "$DRY" = "true" ] && ARGS="--dry-run"
          python3 build/buffer_publish.py publish --tag "$TAG" --content-id "reel-$TAG" \
            --video "$RAW_URL" --caption "output/auto-${TAG}_caption.txt" \
            --marker "output/auto-${TAG}.buffer.json" --thumbnail-ms 1600 $ARGS
          code=$?
          set -e
          # buffer-error is reserved for ACTUAL Buffer read-only/mutation
          # failures (2 no token · 5 API error · 6 no channel). Precondition
          # failures (3 caption, 4 public URL) and anything unexpected are
          # automation-error — they prove nothing about Buffer.
          case "$code" in
            0) if [ -s "output/auto-${TAG}.buffer.json" ]; then st=queued-in-buffer; else st=approved-dry-run; fi ;;
            8) st=approved-dry-run ;;
            7) st=queue-full ;;
            2|5|6) st=buffer-error ;;
            *) st=automation-error ;;
          esac
          echo "status=$st" >> "$GITHUB_OUTPUT"
          echo "buffer step exit=$code → $st"
          unset BUFFER_TOKEN

      - name: Buffer metrics sync + retention (read-only API; never fails the run)
        if: always()
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
        run: |
          python3 build/performance_analyst.py collect || true
          python3 build/retention.py --apply || true

      - name: record outcome (manifest + editorial memory)
        if: always()
        env:
          P: ${{ steps.produce.outputs.code }}
          V: ${{ steps.verify.outputs.code }}
          BST: ${{ steps.buffer.outputs.status }}
          PUSH: ${{ steps.push.outcome }}
        run: |
          set -euo pipefail
          # Cascade order — a QA/failure outcome is AUTHORITATIVE and can never
          # be overridden by the Buffer step (which must not even have run):
          #   1. produce failed (P != 0, e.g. 10 = qa-failed) → keep the state-file status
          #   2. push failed/skipped                          → automation-error
          #   3. verify failed                                → qa-failed
          #   4. otherwise → Buffer step outcome (or automation-error if missing)
          if [ "$P" != "0" ]; then
            STATUS=$(python3 -c "import json,sys;print(json.load(open('output/auto-${TAG}_state.json')).get('status','automation-error'))" 2>/dev/null || echo automation-error)
          elif [ "$PUSH" != "success" ]; then
            STATUS="automation-error"
          elif [ "$V" != "0" ]; then
            STATUS="qa-failed"
          elif [ -n "$BST" ]; then
            STATUS="$BST"
          else
            STATUS="automation-error"
          fi
          echo "FINAL_STATUS=$STATUS" >> "$GITHUB_ENV"
          python3 build/pipeline.py record --tag "$TAG" --status "$STATUS"
          python3 build/performance_analyst.py report >/dev/null || true
          # persist memory + manifest on the default branch (small JSON only)
          git config user.name "reel-factory"
          git config user.email "factory@metacognition.hq"
          git add content/editorial_memory.json content/performance_history.json
          git add -f "output/auto-${TAG}_manifest.json" 2>/dev/null || true
          git commit -q -m "memory: reel $TAG → $STATUS" || echo "nothing to commit"
          pushed=no
          for i in 1 2 3; do
            if git pull -q --rebase --autostash origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "memory pushed"; pushed=yes; break
            fi
            echo "push attempt $i failed — retrying"; sleep 5
          done
          if [ "$pushed" != "yes" ]; then
            echo "::warning::editorial memory could not be pushed to ${GITHUB_REF_NAME} (branch protection?) — topic de-duplication for the next run is at risk"
            python3 build/pipeline.py note --tag "$TAG" --text "⚠️ editorial memory / manifest could NOT be pushed to \`${GITHUB_REF_NAME}\` (branch protection or race). Tomorrow's topic de-duplication may not see today's reel; allow the workflow to push to the default branch."
          fi

      - name: daily report issue (exactly one per content id)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 build/report_issue.py --tag "$TAG" --state "output/auto-${TAG}_state.json" \
            --repo "$GITHUB_REPOSITORY" --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: QA artifacts (contact sheet, reports, logs — internal only)
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: reel-${{ env.TAG }}-qa
          if-no-files-found: ignore
          retention-days: 14
          path: |
            output/auto-${{ env.TAG }}_qa.json
            output/auto-${{ env.TAG }}_qa.md
            output/auto-${{ env.TAG }}_state.json
            output/auto-${{ env.TAG }}_issue.md
            output/drafts/auto-${{ env.TAG }}/qa_contact_sheet.jpg
            output/drafts/auto-${{ env.TAG }}/qa_frames/
            content/episodes/auto-${{ env.TAG }}/layout.json
            content/episodes/auto-${{ env.TAG }}/visual_plan.json

      - name: fail the run when there is no post today
        if: always()
        run: |
          case "${FINAL_STATUS:-}" in
            queued-in-buffer|approved-dry-run) echo "OK: $FINAL_STATUS" ;;
            *) echo "::error::no post today ($FINAL_STATUS) — see the daily issue"; exit 1 ;;
          esac
